# Vehix Agent — frontend nginx (SPA static files only)
# API routing is handled by the host nginx — it strips the /vehix/ prefix,
# so requests arrive here with paths relative to /.
server {
    listen 80;
    server_name _;

    # SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
