<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Circular background with gradient-like effect -->
  <circle cx="60" cy="60" r="56" fill="#1E293B" stroke="#10B981" stroke-width="4" />
  <circle cx="60" cy="60" r="48" fill="#0F172A" opacity="0.5" />
  <!-- Circuit brain / AI node pattern -->
  <!-- Central node -->
  <circle cx="60" cy="60" r="8" fill="#10B981" />
  <!-- Top node -->
  <circle cx="60" cy="34" r="5" fill="#34D399" />
  <line x1="60" y1="42" x2="60" y2="52" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <!-- Left node -->
  <circle cx="34" cy="56" r="5" fill="#34D399" />
  <line x1="42" y1="56" x2="52" y2="56" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="50" x2="34" y2="56" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <!-- Right node -->
  <circle cx="86" cy="56" r="5" fill="#34D399" />
  <line x1="68" y1="56" x2="78" y2="56" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom left -->
  <circle cx="44" cy="82" r="5" fill="#34D399" />
  <line x1="53" y1="67" x2="48" y2="77" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom right -->
  <circle cx="76" cy="82" r="5" fill="#34D399" />
  <line x1="67" y1="67" x2="72" y2="77" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <!-- Outer ring arcs for tech feel -->
  <circle cx="60" cy="60" r="38" stroke="#10B981" stroke-width="1" opacity="0.3" stroke-dasharray="8 4" />
</svg>
