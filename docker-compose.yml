# Vehix Agent — Docker Compose
#
# Services:
#   backend       — FastAPI + LangGraph Agent + Vehicle Simulators
#   frontend      — React + Vite dev server
#   xtream-codec  — JT/T 808/1078 protocol gateway (Java, optional)
#   postgres      — Shared database (for xtream-codec)
#
# Usage:
#   docker compose up -d                    # All services
#   docker compose up -d backend frontend   # Minimal (no xtream-codec)
#   docker compose --profile jtt up -d      # With JT/T 808

services:
  # ── Core: Python backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VEHIX_DATABASE_URL=sqlite+aiosqlite:///./vehix.db
      - VEHIX_LLM_API_KEY=${VEHIX_LLM_API_KEY:-}
      - VEHIX_LLM_BASE_URL=${VEHIX_LLM_BASE_URL:-https://api.openai.com/v1}
      - VEHIX_LLM_MODEL=${VEHIX_LLM_MODEL:-gpt-4o-mini}
      - VEHIX_SIMULATOR_ENABLED=true
      - VEHIX_SIMULATOR_VEHICLE_COUNT=10
      - VEHIX_SIMULATOR_TELEMETRY_INTERVAL_S=5.0
      - VEHIX_SIMULATOR_FAULT_PROBABILITY=0.02
      # Switch to PostgreSQL: uncomment the next line + ensure postgres service is up
      # VEHIX_DATABASE_URL=postgresql+asyncpg://xtream:xtream@postgres:5432/xtream
      # JT/T 808 bridge (optional — set to enable)
      - VEHIX_JTT808_ENABLED=${VEHIX_JTT808_ENABLED:-false}
      - VEHIX_JTT808_BASE_URL=${VEHIX_JTT808_BASE_URL:-http://xtream-codec:8808}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Core: React frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Extension: xtream-codec (JT/T 808/1078 gateway) ──────────
  # Profile "jtt" — only starts when explicitly requested:
  #   docker compose --profile jtt up -d
  xtream-codec:
    image: registry.cn-hangzhou.aliyuncs.com/xtream-codec/jt-808-server-quick-start-with-dashboard:latest
    profiles: ["jtt"]
    ports:
      - "8808:8808"    # JT/T 808 TCP server
      - "8888:8888"    # Dashboard UI
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/xtream
      - SPRING_DATASOURCE_USERNAME=xtream
      - SPRING_DATASOURCE_PASSWORD=xtream
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Database: PostgreSQL (optional, SQLite by default) ────────
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=xtream
      - POSTGRES_USER=xtream
      - POSTGRES_PASSWORD=xtream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtream"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
