# Vehix Agent — Docker Compose
#
# Architecture: no nginx inside Docker. Frontend and backend each publish
# a loopback-only port, and the host nginx proxies directly to each service
# (multiple location blocks — see host-nginx.conf.example):
#   /vehix/api/  → 127.0.0.1:8081 (backend)
#   /vehix/      → 127.0.0.1:8080 (frontend)
#
# Quick start:
#   VEHIX_LLM_API_KEY=sk-xxx docker compose up -d

services:
  # ── Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Loopback-only: only host nginx (same machine) can reach it.
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      - VEHIX_DATABASE_URL=sqlite+aiosqlite:///./vehix.db
      - VEHIX_LLM_API_KEY=${VEHIX_LLM_API_KEY:-}
      - VEHIX_LLM_BASE_URL=${VEHIX_LLM_BASE_URL:-https://api.deepseek.com}
      - VEHIX_LLM_MODEL=${VEHIX_LLM_MODEL:-deepseek-chat}
      - VEHIX_SIMULATOR_ENABLED=true
      - VEHIX_SIMULATOR_VEHICLE_COUNT=10
      - VEHIX_SIMULATOR_TELEMETRY_INTERVAL_S=5.0
      - VEHIX_SIMULATOR_FAULT_PROBABILITY=0.02
      - VEHIX_JTT808_ENABLED=${VEHIX_JTT808_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_BASE_URL: ${VITE_BASE_URL:-/vehix/}
    # Loopback-only: only host nginx (same machine) can reach it.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL (optional) ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    profiles: ["pg"]
    environment:
      - POSTGRES_DB=xtream
      - POSTGRES_USER=xtream
      - POSTGRES_PASSWORD=xtream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── xtream-codec (JT/T 808) ────────────────────────────────────
  xtream-codec:
    image: registry.cn-hangzhou.aliyuncs.com/xtream-codec/jt-808-server-quick-start-with-dashboard:latest
    profiles: ["jtt"]
    ports:
      - "8808:8808"
      - "8888:8888"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/xtream
      - SPRING_DATASOURCE_USERNAME=xtream
      - SPRING_DATASOURCE_PASSWORD=xtream
    depends_on:
      postgres:
        condition: service_started

volumes:
  pgdata:
