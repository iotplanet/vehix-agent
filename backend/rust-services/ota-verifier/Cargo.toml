[package]
name = "ota-verifier"
version = "0.1.0"
edition = "2021"
description = "OTA package integrity and authenticity verifier — SHA-256 + Ed25519"

[lib]
name = "ota_verifier"
crate-type = ["cdylib", "rlib"]

[dependencies]
# SHA-256 hashing
sha2 = "0.10"

# Ed25519 signatures
ed25519-dalek = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex encoding
hex = "0.4"

# PyO3 (Phase 2)
# pyo3 = { version = "0.22", features = ["extension-module"] }
