# Vehix Agent — internal nginx aggregator (HTTP only, TLS handled by host nginx)
#
# This is the SINGLE entry point for all traffic inside Docker.
# Host nginx strips the /vehix/ prefix (trailing slash in proxy_pass), so
# requests arrive here with paths relative to /.
# Routing table:
#   /             → frontend (SPA static files)
#   /api/         → backend (REST API)
#   /mcp/         → backend (MCP endpoint)
#   /docs         → backend (OpenAPI docs)
#   /openapi.json → backend (OpenAPI schema)

server {
    listen 80;
    server_name _;

    # ── Frontend SPA (default) ───────────────────────────────────
    # Host nginx strips the /vehix/ prefix, so requests arrive at /.
    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Backend API ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── MCP endpoint ─────────────────────────────────────────────
    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── API docs (optional) ──────────────────────────────────────
    location /docs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
